function parentView(){
  const kids=sortedKids();
  if(S.code&&!kids.length)return `<div class="card"><h3>Link non valido</h3><p class="sub">Chiedi alla maestra il link aggiornato del tuo bambino.</p></div>`;
  if(!kids.length)return `<div class="card"><h3>Nessun bambino ancora</h3><p class="sub">Le maestre devono prima aggiungere i bambini della sezione.</p></div>`;
  if(S.code){const f=kids.find(x=>x.codice===S.code);if(!f)return `<div class="card"><h3>Link non valido</h3><p class="sub">Chiedi alla maestra il link aggiornato del tuo bambino.</p></div>`;S.child=f.id}
  else if(!S.teacher)return `<div class="card hero"><h2>Benvenuto</h2><p class="sub">Apri il link personale che ti ha mandato la maestra: vedrai la giornata del tuo bambino.</p></div>`;
  if(!kids.find(k=>k.id===S.child))S.child=kids[0].id;
  const k=kids.find(x=>x.id===S.child),e=S.diary[k.id];
  S.mine=(S.msgs||[]).filter(m=>m.bambino===k.id).map(({bambino,...m})=>({...m,bambino}));
  const seen=seenFor(k.id);S.seen=seen;const isNew=t=>+t>seen;
  const news=[];
  if(e&&isNew(e.ts))news.push(`Diario di ${fmt(S.date,{weekday:'long',day:'numeric',month:'long'})} compilato`);
  if(S.menu&&isNew(S.menu.ts))news.push('Menù del giorno aggiornato');
  upEvs().filter(x=>isNew(x.ts)).forEach(x=>news.push(`Evento: ${x.titolo} (${fmt(x.data,{weekday:'short',day:'numeric',month:'short'})})`));
  S.acts.filter(a=>isNew(a.ts)).forEach(a=>news.push(`${a.tipo||'Attività'}: ${a.titolo} (${fmt(a.data,{weekday:'short',day:'numeric',month:'short'})})`));
  const newsBox=news.length?`<div class="news"><div class="nt"><span class="bell" aria-hidden="true">🔔</span><h3>Novità dall'ultima visita</h3></div><ul>${news.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:'';
  const pick=!S.code&&kids.length>1?`<label for="pick">Il tuo bambino</label><select id="pick">${kids.map(x=>`<option value="${esc(x.id)}"${x.id===k.id?' selected':''}>${esc(x.nome)}</option>`).join('')}</select>`:'';
  let day;
  if(!e)day=`<p class="empty">La maestra non ha ancora compilato il diario di questa giornata.</p>`;
  else if(e.assente)day=`<p class="note"><b>Assente</b> in questa giornata.</p>`;
  else day=`${pastoBox(e)}<div class="grid">
    <div class="it c2">${IC.merenda}<b>Merenda</b><span>${esc(e.merenda||'—')}</span></div>
    <div class="it c3">${IC.cacca}<b>Cacca</b><span>${esc(caccaTxt(e.cacca))}</span></div>
    <div class="it c4">${IC.nanna}<b>Nanna</b><span>${esc(nannaTxt(e.nanna))}</span></div>
    <div class="it c5">${IC.umore}<b>Umore</b><span>${esc(e.umore||'—')}</span></div></div>
    ${e.portare&&e.portare.length?`<div style="margin-top:16px"><b>Da portare domani</b><div class="chips">${e.portare.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div></div>`:''}
    ${e.note?`<div class="note"><b>Dalla maestra:</b> ${esc(e.note)}</div>`:''}`;
  return newsBox+evsCard(false,seen)+`<section class="card hero">${pick}<div class="who" style="margin-top:${pick?'16px':0}">${av(k)}<div><h2>${esc(k.nome)}</h2><p class="sub">La giornata di ${esc(fmt(S.date))} ${e&&isNew(e.ts)?NB:''}</p></div></div>${k.allergie?`<p class="small">Note alimentari: ${esc(k.allergie)}</p>`:''}${day}</section>
  ${menuCard()}${actsCard(false)}${msgForm(k)}`;

function pastoBox(e){

  <label for="mx">Messaggio</label><textarea id="mx" placeholder="Es. esce alle 15, lo ritira la nonna Maria"></textarea>
  <button class="btn">Invia</button></form>
  ${mine.length?`<h3 style="font-size:18px;margin-top:20px">I tuoi avvisi</h3><div class="list">${mine.map(m=>`<div class="msg" style="display:flex;gap:8px;align-items:start"><div style="flex:1"><span class="tag">${esc(m.tipo)}</span><b>${esc(fmt(m.data,{day:'numeric',month:'short'}))}</b> — ${esc(m.testo)}</div><button class="del" data-del-msg="${esc(m.ts)}">${S.armed==='M'+m.ts?'Conferma':'Elimina'}</button></div>`).join('')}</div>`:''}</section>`;
}

/* ---------- MAESTRA ---------- */
function teacherView(){
  const nMsg=pendingMsgs().length;
  const tabs=[['diario','Diario'],['menu','Menù e attività'],['bimbi','Bambini'],['msg','Avvisi genitori'+(nMsg?` (${nMsg})`:'')]];
  const t=`${S.preview?'':''}<div class="tabs" role="tablist">${tabs.map(([id,l])=>`<button class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${esc(l)}</button>`).join('')}</div>`;
  const body={diario:tDiary,menu:tMenu,bimbi:tKids,msg:tMsgs}[S.tab]();
  return t+body;
}
function seg(g,opts,val,multi){
  const vals=multi?(val||[]):[val];
  return `<div class="seg" data-g="${g}"${multi?' data-multi':''}>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<button type="button" data-v="${esc(v)}" aria-pressed="${vals.includes(v)}">${esc(l)}</button>`}).join('')}</div>`;
}
function kidCard(k){
  const e=S.diary[k.id]||{};
  const pills=e.assente?'<span class="pill w">Assente</span>':S.diary[k.id]?`<span class="pill ok">Compilato</span>${e.cacca&&e.cacca!=='0'?'<span class="pill">Cacca ✓</span>':''}`:'<span class="pill">Da compilare</span>';
  const msg=pendingMsgs().filter(m=>m.data===S.date&&m.bambino===k.id).length?'<span class="pill w">Avviso genitore</span>':'';
  return `<details class="kid" data-kid="${esc(k.id)}"${S.open.has(k.id)?' open':''}><summary>${av(k,1)}<span class="n">${esc(k.nome)}</span>${msg}${pills}</summary><div class="body">
  ${k.allergie?`<p class="chip" style="display:inline-block">Attenzione: ${esc(k.allergie)}</p>`:''}
  <label>Presenza</label>${seg('assente',[['no','Presente'],['si','Assente']],e.assente?'si':'no')}
  <label style="font-size:16px;margin-top:18px">Pranzo</label>${PORT.map(([k,l])=>`<label class="sl">${l}</label>${seg('p_'+k,PRANZO,(e.pasto||{})[k])}`).join('')}
  <label>Merenda</label>${seg('merenda',PRANZO,e.merenda)}
  <label>Cacca</label>${seg('cacca',CACCA,e.cacca)}
  <div class="two"><div><label>Nanna dalle</label><input type="time" data-f="da" value="${esc(e.nanna?.da||'')}"></div><div><label>alle</label><input type="time" data-f="a" value="${esc(e.nanna?.a||'')}"></div></div>
  <label>Umore</label>${seg('umore',UMORE,e.umore)}
  <label>Da portare</label>${seg('portare',PORTARE,e.portare,true)}
  <label>Note per i genitori</label><textarea data-f="note" placeholder="Com'è andata la giornata, cosa ha fatto, piccoli episodi…">${esc(e.note||'')}</textarea>
  <button class="btn" data-save="${esc(k.id)}">Salva ${esc(k.nome)}</button></div></details>`;
}
function tDiary(){
  const kids=sortedKids();
  if(!kids.length)return `<div class="card"><h3>Aggiungi i bambini</h3><p class="sub">Vai nella scheda “Bambini” per creare la sezione.</p></div>`;
  const done=kids.filter(k=>S.diary[k.id]).length;
  return `<section class="card hero"><h2>${done} di ${kids.length} compilati</h2><p class="sub">Tocca un bambino per compilare la sua giornata. I genitori vedono subito quello che salvi.</p><div class="list" id="kids">${kids.map(kidCard).join('')}</div></section>`;
}
function tMenu(){
  const mon=mondayOf(S.date),days=[0,1,2,3,4].map(i=>addDays(mon,i));
  const F=[['primo','Primo','Pasta al pomodoro'],['secondo','Secondo','Polpette'],['contorno','Contorno','Carote'],['frutta','Frutta','Mela'],['merenda','Merenda','Yogurt']];
  const day=(d,i)=>{const m=S.week[d]||{};const filled=F.some(([k])=>m[k]);
    return `<details class="kid" data-mday="${d}"${d===S.date||S.menuOpen===d?' open':''}><summary><span class="n" style="text-transform:capitalize">${esc(fmt(d,{weekday:'long',day:'numeric',month:'short'}))}</span><span class="pill${filled?' ok':''}">${filled?'Inserito':'Vuoto'}</span></summary><div class="body"><div class="two">${F.map(([k,l,ph])=>`<div><label for="m_${i}_${k}">${l}</label><input id="m_${i}_${k}" data-mf="${k}" value="${esc(m[k]||'')}" placeholder="${ph}"></div>`).join('')}</div>${i<4?`<button type="button" class="btn g" data-copyday="${i}">Copia uguale nel giorno dopo</button>`:''}</div></details>`};
  return `<section class="card hero"><h2>Menù della settimana</h2><p class="sub">Dal ${esc(fmt(days[0],{day:'numeric',month:'long'}))} al ${esc(fmt(days[4],{day:'numeric',month:'long'}))}. Con le frecce in alto cambi settimana.</p><form id="menuf"><div class="list">${days.map(day).join('')}</div><button class="btn">Salva tutta la settimana</button></form></section>
  <section class="card"><h3>Evento in evidenza</h3><p class="sub">Resta sempre in cima per i genitori fino al giorno dell'evento. Puoi aggiungerne quanti vuoi: la recita, la gita, la festa…</p><form id="evf" novalidate><label for="e_tit">Cosa</label><input id="e_tit" placeholder="Es. Recita di Natale">
  <div class="two"><div><label for="e_data">Giorno</label><input type="date" id="e_data" value="${esc(S.date)}"></div><div><label for="e_ora">Ora</label><input type="time" id="e_ora"></div></div>
  <label for="e_luogo">Dove</label><input id="e_luogo" placeholder="Es. Salone dell'asilo">
  <label for="e_note">Note (facoltativo)</label><input id="e_note" placeholder="Es. portare il vestitino rosso">
  <button class="btn">Aggiungi evento</button></form></section>${evsCard(true)}
  <section class="card"><h3>Nuova attività o avviso</h3><form id="actf"><div class="two"><div><label for="a_data">Giorno</label><input type="date" id="a_data" value="${esc(S.date)}" required></div><div><label for="a_tipo">Tipo</label><select id="a_tipo">${TIPI.map(t=>`<option>${t}</option>`).join('')}</select></div></div>
  <label for="a_tit">Titolo</label><input id="a_tit" required placeholder="Pittura con le dita">
  <label for="a_desc">Descrizione</label><textarea id="a_desc" placeholder="Cosa faremo"></textarea>
  <label for="a_port">Da portare (facoltativo)</label><input id="a_port" placeholder="Grembiule vecchio">
  <button class="btn">Aggiungi</button></form></section>${actsCard(true)}`;
}
function tKids(){
  const kids=sortedKids();
  return `<section class="card hero"><h2>Bambini della sezione</h2><form id="kidf"><div class="two"><div><label for="k_n">Nome</label><input id="k_n" required placeholder="Giulia R."></div><div><label for="k_s">Sezione</label><input id="k_s" placeholder="Pulcini"></div></div>
  <label for="k_a">Allergie o note alimentari</label><input id="k_a" placeholder="Nessuna"><button class="btn">Aggiungi bambino</button></form>
  <p class="small">Ogni bambino ha un link personale: mandalo solo ai suoi genitori (WhatsApp, email…). Con quel link vedono solo il loro bambino.</p>
  <div class="list">${kids.map(k=>`<div class="ev"><div>${av(k)}</div><div><b style="font:600 19px Fredoka,sans-serif">${esc(k.nome)}</b>${k.sezione?`<div class="small">${esc(k.sezione)}</div>`:''}${k.allergie?`<div class="small">${esc(k.allergie)}</div>`:''}<label for="avs-${esc(k.id)}" style="margin-top:8px">Disegno</label><select id="avs-${esc(k.id)}" data-avsel="${esc(k.id)}" style="max-width:220px"><option value="">Iniziale del nome</option>${Object.entries(AVS).map(([v,a])=>`<option value="${v}"${k.avatar===v?' selected':''}>${a.n}</option>`).join('')}</select>${k.codice?`<div class="small" style="overflow-wrap:anywhere;user-select:all">${esc(linkOf(k))}</div><button class="btn g" style="margin-top:8px" data-copy="${esc(k.id)}">Copia link genitore</button> <button class="del" data-mklink="${esc(k.id)}">${S.armed==='L'+k.id?'Conferma nuovo link':'Cambia link'}</button>`:`<button class="btn g" style="margin-top:8px" data-mklink="${esc(k.id)}">Crea link genitore</button>`}</div><button class="del" data-del-kid="${esc(k.id)}">${S.armed===k.id?'Conferma':'Elimina'}</button></div>`).join('')||`<p class="empty">Ancora nessun bambino.</p><button class="btn g" data-seed="1">Importa i 10 bambini</button>`}</div></section>`;
}
function pendingMsgs(){
  const from=addDays(iso(new Date()),-1);
  return S.msgs.filter(m=>m.data>=from).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:b.ts-a.ts);
}
function tMsgs(){
  const ms=pendingMsgs();
  return `<section class="card hero"><h2>Avvisi dei genitori</h2><p class="sub">Assenze, ritiri e note da ieri in avanti.</p><div class="list">${ms.map(m=>`<div class="msg"><span class="tag">${esc(m.tipo)}</span><b>${esc(kidName(m.bambino))}</b> · ${esc(fmt(m.data,{weekday:'short',day:'numeric',month:'short'}))}<div>${esc(m.testo)}</div></div>`).join('')||'<p class="empty">Nessun avviso.</p>'}</div></section>`;
}

/* ---------- AZIONI ---------- */
function setDate(d){S.date=d;S.menuDirty=false;S.dirty.clear();S.open.clear();subDay();render()}
$('#prev').onclick=()=>setDate(addDays(S.date,-1));
$('#next').onclick=()=>setDate(addDays(S.date,1));
$('#today').onclick=()=>setDate(iso(new Date()));
$('#role').onclick=()=>{S.preview=!S.preview;render()};
const safe=async(fn,ok)=>{try{await fn();if(ok)flash(ok)}catch(e){flash(e&&e.code==='quota_exceeded'?'Spazio esaurito: elimina vecchi dati':'Non salvato: '+(e&&e.code==='invalid_argument'?'permesso mancante':'riprova'))}};

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;S.armed=null;render();return}
  const g=b.closest('.seg');
  if(g&&b.dataset.v!=null){
    if(g.hasAttribute('data-multi'))b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
    else{const on=b.getAttribute('aria-pressed')==='true';g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',String(!on))}
    const kid=b.closest('[data-kid]');if(kid)S.dirty.add(kid.dataset.kid);return;
  }
  if(b.dataset.copyday!=null){const i=+b.dataset.copyday,from=document.querySelectorAll('[data-mday]')[i],to=document.querySelectorAll('[data-mday]')[i+1];
    if(from&&to){from.querySelectorAll('[data-mf]').forEach(inp=>{to.querySelector(`[data-mf="${inp.dataset.mf}"]`).value=inp.value});to.open=true;S.menuDirty=true;flash('Copiato nel giorno dopo')}return}
  if(b.dataset.delMsg){const t=b.dataset.delMsg;if(S.armed!=='M'+t){S.armed='M'+t;render();return}S.armed=null;
    const items=S.mine.filter(m=>String(m.ts)!==t);safe(()=>S.db.doc(`famiglie/${S.child}/extra/avvisi`).set({items}),'Avviso eliminato');return}
  if(b.dataset.seed){b.disabled=true;safe(async()=>{for(const k of SEED)await S.db.doc('famiglie/'+k.codice).set({...k,sezione:'',allergie:''})},'Bambini importati');return}
  if(b.id==='logout'){firebase.auth().signOut();return}
  if(b.dataset.save){saveKid(b.dataset.save);return}
  if(b.dataset.copy){const k=S.kids.find(x=>x.id===b.dataset.copy);if(k)navigator.clipboard.writeText(linkOf(k)).then(()=>flash('Link copiato: '+k.nome),()=>flash('Tieni premuto sul link per copiarlo'));return}
  if(b.dataset.mklink){const k=S.kids.find(x=>x.id===b.dataset.mklink);if(!k)return;
    if(k.codice&&S.armed!=='L'+k.id){S.armed='L'+k.id;render();return}
    S.armed=null;safe(()=>moveKid(k),'Nuovo link creato: il vecchio non funziona più');return}
  const da=b.dataset.delAct,dk=b.dataset.delKid,de=b.dataset.delEv,id=da||dk||de;
  if(id){if(S.armed!==id){S.armed=id;render();return}S.armed=null;safe(()=>S.db.doc((da?'attivita/':de?'eventi/':'famiglie/')+id).delete(),'Eliminato');return}
});
document.addEventListener('input',ev=>{if(ev.target.closest('#menuf')){S.menuDirty=true;return}const k=ev.target.closest('[data-kid]');if(k)S.dirty.add(k.dataset.kid)});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.matches&&d.matches('details.kid')){d.open?S.open.add(d.dataset.kid):S.open.delete(d.dataset.kid)}},true);
document.addEventListener('change',ev=>{const as=ev.target.dataset&&ev.target.dataset.avsel;if(as){safe(()=>S.db.doc('famiglie/'+as).update({avatar:ev.target.value}),'Disegno cambiato');return}
  if(ev.target.id==='pick'){S.child=ev.target.value;try{localStorage.setItem('asilo-child',S.child)}catch(e){}render()}});

async function saveKid(id){
  const c=document.querySelector(`[data-kid="${CSS.escape(id)}"]`);if(!c)return;
  const one=g=>{const x=c.querySelector(`[data-g="${g}"] [aria-pressed=true]`);return x?x.dataset.v:''};
  const doc={data:S.date,bambino:id,assente:one('assente')==='si',pasto:Object.fromEntries(PORT.map(([k])=>[k,one('p_'+k)])),merenda:one('merenda'),cacca:one('cacca'),umore:one('umore'),
    portare:[...c.querySelectorAll('[data-g="portare"] [aria-pressed=true]')].map(x=>x.dataset.v),
    nanna:{da:c.querySelector('[data-f=da]').value,a:c.querySelector('[data-f=a]').value},note:c.querySelector('[data-f=note]').value.trim(),ts:Date.now()};
  await safe(()=>S.db.doc(`famiglie/${id}/diario/${S.date}`).set(doc),'Salvato: '+kidName(id));
  S.dirty.delete(id);S.open.delete(id);render();
}
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target,v=id=>(f.querySelector('#'+id)?.value||'').trim();
  if(f.id==='menuf'){
    const ops=[];
    f.querySelectorAll('[data-mday]').forEach(el=>{const d=el.dataset.mday,doc={data:d};let any=false,changed=false;const old=S.week[d]||{};
      el.querySelectorAll('[data-mf]').forEach(inp=>{const val=inp.value.trim();doc[inp.dataset.mf]=val;if(val)any=true;if(val!==(old[inp.dataset.mf]||''))changed=true});
      if(changed&&(any||S.week[d])){doc.ts=Date.now();ops.push(()=>S.db.doc('menu/'+d).set(doc))}});
    S.menuDirty=false;
    if(!ops.length){flash('Nessuna modifica');return}
    await safe(async()=>{for(const o of ops)await o()},'Menù della settimana salvato');render();
  }
  if(f.id==='actf'&&v('a_tit')){await safe(()=>S.db.collection('attivita').add({data:v('a_data'),tipo:v('a_tipo'),titolo:v('a_tit'),desc:v('a_desc'),portare:v('a_port'),ts:Date.now()}),'Attività aggiunta');f.reset()}
  if(f.id==='evf'&&!v('e_tit')){flash('Scrivi cosa: es. Recita di Natale');return}
  if(f.id==='evf'&&!v('e_data')){flash('Scegli il giorno');return}
  if(f.id==='evf'){await safe(()=>S.db.collection('eventi').add({titolo:v('e_tit'),data:v('e_data'),ora:v('e_ora'),luogo:v('e_luogo'),note:v('e_note'),ts:Date.now()}),'Evento aggiunto');f.reset();const dd=f.querySelector('#e_data');if(dd)dd.value=S.date}
  if(f.id==='loginf'){const er=f.querySelector('#l_err');er.textContent='Accesso in corso…';
    try{await firebase.auth().signInWithEmailAndPassword(v('l_e'),f.querySelector('#l_p').value)}catch(e){er.textContent='Email o password non corrette.'}return}
  if(f.id==='kidf'&&v('k_n')){const c=newCode();await safe(()=>S.db.doc('famiglie/'+c).set({nome:v('k_n'),sezione:v('k_s'),allergie:v('k_a'),codice:c}),'Bambino aggiunto');f.reset()}
  if(f.id==='mform'&&v('mx')&&S.child){
    const items=[...S.mine,{tipo:v('mt'),data:v('md'),testo:v('mx'),bambino:S.child,ts:Date.now()}].slice(-30);
    await safe(()=>S.db.doc(`famiglie/${S.child}/extra/avvisi`).set({items}),'Avviso inviato alla maestra');f.reset();
  }
});

/* ---------- DATI ---------- */
const rows=snap=>snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
const fail=()=>{S.loaded=true;S.warn='Non riesco a leggere il diario adesso.';render()};
function rerender(){
  if(isT()&&S.tab==='menu'&&S.menuDirty)return;
  // non cancellare i moduli che la maestra sta compilando
  if(isT()&&S.tab==='diario'&&S.dirty.size){
    const box=$('#kids');if(!box){render();return}
    for(const k of sortedKids()){if(S.dirty.has(k.id))continue;const el=box.querySelector(`[data-kid="${CSS.escape(k.id)}"]`);if(el)el.outerHTML=kidCard(k)}
    return;
  }
  render();
}
let daySubs=[],extraSubs=[],kidKey='';
function subDay(){
  if(!S.db)return;
  daySubs.forEach(u=>u());daySubs=[];S.diary={};S.menu=null;
  const ids=S.teacher?S.kids.map(k=>k.id):(S.code?[S.code]:[]);
  ids.forEach(id=>daySubs.push(S.db.doc(`famiglie/${id}/diario/${S.date}`).onSnapshot(d=>{if(d.exists)S.diary[id]={id:d.id,...d.data()};else delete S.diary[id];rerender()},()=>{})));
  daySubs.push(S.db.doc('menu/'+S.date).onSnapshot(d=>{S.menu=d.exists?d.data():null;rerender()},()=>{}));
  const mon=mondayOf(S.date);
  if(S.teacher&&mon!==weekKey){weekKey=mon;unWeek&&unWeek();S.week={};
    unWeek=S.db.collection('menu').where('data','>=',mon).where('data','<=',addDays(mon,4)).onSnapshot(sn=>{S.week={};rows(sn).forEach(r=>S.week[r.data]=r);rerender()},()=>{})}
}
function subExtra(){
  extraSubs.forEach(u=>u());extraSubs=[];const all={};
  const ids=S.teacher?S.kids.map(k=>k.id):(S.code?[S.code]:[]);
  ids.forEach(id=>extraSubs.push(S.db.doc(`famiglie/${id}/extra/avvisi`).onSnapshot(d=>{const it=d.exists&&Array.isArray(d.data().items)?d.data().items:[];all[id]=it.map(m=>({...m,bambino:id}));
    S.msgs=Object.values(all).flat();if(id===S.code||(!S.code&&id===S.child))S.mine=all[id];rerender()},()=>{})));
}
function kidsChanged(){const key=S.kids.map(k=>k.id).sort().join();if(key!==kidKey){kidKey=key;subDay();subExtra()}}
async function moveKid(k){
  const c=newCode(),old=S.db.doc('famiglie/'+k.id),nw=S.db.doc('famiglie/'+c);
  await nw.set({...Object.fromEntries(Object.entries(k).filter(([x])=>x!=='id')),codice:c});
  const ds=await old.collection('diario').get();for(const d of ds.docs){await nw.collection('diario').doc(d.id).set(d.data());await d.ref.delete()}
  const av=await old.collection('extra').doc('avvisi').get();if(av.exists){await nw.collection('extra').doc('avvisi').set(av.data());await av.ref.delete()}
  await old.delete();
}
let mainSubs=[];
function start(){
  mainSubs.forEach(u=>u());mainSubs=[];daySubs.forEach(u=>u());daySubs=[];extraSubs.forEach(u=>u());extraSubs=[];kidKey='';weekKey='';
  S.kids=[];S.loaded=false;S.warn='';render();
  const db=S.db;const timer=setTimeout(()=>{if(!S.loaded){S.warn='Il diario non risponde ancora: controlla la connessione.';render()}},10000);
  const ok=()=>{S.loaded=true;clearTimeout(timer);S.warn=''};
  if(S.teacher){
    mainSubs.push(db.collection('famiglie').onSnapshot(s=>{S.kids=rows(s);ok();kidsChanged();rerender()},e=>{clearTimeout(timer);S.loaded=true;S.warn='Questa email non è abilitata come maestra.';render()}));
  }else if(S.code){
    mainSubs.push(db.doc('famiglie/'+S.code).onSnapshot(d=>{S.kids=d.exists?[{id:d.id,...d.data()}]:[];ok();kidsChanged();rerender()},()=>{clearTimeout(timer);fail()}));
  }else{ok();render();return}
  mainSubs.push(db.collection('eventi').onSnapshot(s=>{S.evs=rows(s);rerender()},()=>{}));
  mainSubs.push(db.collection('attivita').orderBy('data').limit(400).onSnapshot(s=>{S.acts=rows(s);rerender()},()=>{}));
}
window.addEventListener('hashchange',()=>{if(!S.teacher)start()});
try{
  if(firebaseConfig.apiKey==='INCOLLA-QUI')throw new Error('cfg');
  firebase.initializeApp(firebaseConfig);S.db=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{S.teacher=!!u;S.preview=false;start()});
}catch(e){S.warn=e.message==='cfg'?'Manca il firebaseConfig: incollalo in cima al file index.html.':'Errore di avvio.';S.loaded=true}
render();
}
</script>
</body></html>
